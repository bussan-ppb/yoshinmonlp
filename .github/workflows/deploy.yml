# 段階デプロイ用ワークフロー
# - preview ブランチへの push → gh-pages の /preview/ サブディレクトリに反映（師範レビュー用）
# - 手動実行（workflow_dispatch）→ main HEAD を本番ルートに公開
#
# main への push では何も公開されない。レビューが必要なときだけ
# `git push origin main:preview` でプレビューを出す運用とする
# （main への push ごとに /preview/ がサイト全体で上書きされ、
#   公開済み記事のプレビューが復活してしまうのを防ぐため）。
#
# 反映はミラー方式（.github/scripts/sync-site.sh）。ソースから消したファイルは
# 公開先からも消える。写真の削除依頼に確実に応えられるようにするため。
#
# プレビューURL: https://yoshinmon-official.jp/preview/
# 本番URL:     https://yoshinmon-official.jp/
name: Deploy

on:
  # プレビュー用ブランチへの push を契機に /preview/ を更新
  push:
    branches: [preview]
  # 手動実行: GitHub の Actions タブから「Run workflow」で本番公開
  workflow_dispatch:

permissions:
  # gh-pages ブランチへの書き込み権限
  contents: write

# 同時実行を制御
concurrency:
  group: pages-deploy
  # 本番公開ジョブはキャンセルしない（事故防止）
  cancel-in-progress: false

jobs:
  # ===== preview ブランチへの push → /preview/ サブディレクトリにデプロイ =====
  preview:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: previewブランチをチェックアウト
        uses: actions/checkout@v4
        with:
          path: src

      - name: gh-pagesをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: /preview/ をミラー
        run: src/.github/scripts/sync-site.sh src site preview

      - name: gh-pages に push
        working-directory: site
        env:
          # コミットメッセージはシェルに直接埋め込まず環境変数で渡す（コマンド注入の防止）
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A preview
          if git diff --cached --quiet; then
            echo '変更なし'
            exit 0
          fi
          git commit -q -m "preview: ${HEAD_MESSAGE%%$'\n'*}"
          git push -q origin HEAD:gh-pages

  # ===== 手動: workflow_dispatch → main HEAD を本番ルートに公開 =====
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: mainをチェックアウト
        uses: actions/checkout@v4
        with:
          # 実行時に選んだブランチではなく、必ず main を本番公開する
          # （Actions タブで preview ブランチを選んでも本番に出ないようにする）
          ref: main
          path: src

      - name: gh-pagesをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: 本番ルートをミラー
        run: src/.github/scripts/sync-site.sh src site root

      - name: gh-pages に push
        run: |
          sha=$(git -C src rev-parse HEAD)
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          # 本番固有ファイルが消えていないことを確認（消えていたら中止）
          for f in CNAME .nojekyll; do
            if ! git cat-file -e ":$f" 2>/dev/null; then
              echo "$f が消えるため中止します" >&2
              exit 1
            fi
          done
          echo '削除されるファイル:'
          git diff --cached --name-only --diff-filter=D
          if git diff --cached --quiet; then
            echo '変更なし'
            exit 0
          fi
          git commit -q -m "publish: 本番公開 (main $sha)"
          git push -q origin HEAD:gh-pages
